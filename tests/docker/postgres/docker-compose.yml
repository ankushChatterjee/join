services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-join-intergration-tests
    environment:
      POSTGRES_USER: join
      POSTGRES_PASSWORD: join
      POSTGRES_DB: join_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U join -d join_test"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
